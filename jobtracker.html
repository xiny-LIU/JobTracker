<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTracker - 应届生求职作战指挥部</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: #f8fafc; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        
        /* Timeline */
        .timeline-line { position: absolute; left: 20px; top: 0; bottom: 0; width: 2px; background: #e2e8f0; }
        .timeline-dot { position: absolute; left: 14px; width: 14px; height: 14px; border-radius: 50%; background: white; border: 3px solid #3b82f6; z-index: 10; }
        
        /* Status Colors */
        .status-投递 { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
        .status-笔试 { background: #fef3c7; color: #d97706; border: 1px solid #fcd34d; }
        .status-一面 { background: #dbeafe; color: #2563eb; border: 1px solid #93c5fd; }
        .status-二面 { background: #ddd6fe; color: #7c3aed; border: 1px solid #c4b5fd; }
        .status-三面 { background: #fce7f3; color: #db2777; border: 1px solid #f9a8d4; }
        .status-HR面 { background: #d1fae5; color: #059669; border: 1px solid #6ee7b7; }
        .status-Offer { background: #ecfdf5; color: #059669; border: 1px solid #10b981; font-weight: 600; }
        .status-拒绝 { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .status-接受 { background: #ecfdf5; color: #059669; border: 1px solid #10b981; font-weight: 700; }
        
        /* Priority Stars */
        .star { cursor: pointer; transition: all 0.2s; }
        .star:hover { transform: scale(1.2); }
        .star.active { color: #fbbf24; }
        .star.inactive { color: #e2e8f0; }
        
        /* Card Hover */
        .hover-card { transition: all 0.2s; }
        .hover-card:hover { transform: translateY(-2px); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1); }
        
        /* Modal */
        .modal-backdrop { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        
        /* Print Styles for Interview Prep */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
            .prep-sheet { box-shadow: none !important; border: 1px solid #e2e8f0; }
        }
        
        /* Mood Colors */
        .mood-紧张 { background: #fef3c7; color: #92400e; }
        .mood-平稳 { background: #dbeafe; color: #1e40af; }
        .mood-超水平发挥 { background: #d1fae5; color: #065f46; }
        .mood-被问懵 { background: #fee2e2; color: #991b1b; }
        .mood-一般 { background: #f3f4f6; color: #374151; }
        
        /* Funnel Chart */
        .funnel-bar { transition: width 0.5s ease-out; }
        
        /* Word Cloud */
        .word-tag { display: inline-block; padding: 4px 12px; margin: 4px; border-radius: 20px; font-size: 0.875rem; background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .word-tag.high { background: #fee2e2; color: #991b1b; border-color: #fca5a5; font-weight: 600; }
        .word-tag.medium { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 bg-white/80 backdrop-blur-md border-b border-slate-200 z-50 h-16">
        <div class="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">J</div>
                <h1 class="font-bold text-lg tracking-tight text-slate-900">JobTracker <span class="text-slate-400 font-normal text-sm">应届生求职作战指挥部</span></h1>
            </div>
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
                <button onclick="app.switchView('dashboard')" class="nav-btn px-3 py-1.5 rounded-md text-sm font-medium transition-all bg-white shadow-sm text-slate-900" data-view="dashboard">
                    <i class="fas fa-chart-pie mr-1.5"></i>仪表盘
                </button>
                <button onclick="app.switchView('positions')" class="nav-btn px-3 py-1.5 rounded-md text-sm font-medium transition-all text-slate-600 hover:text-slate-900" data-view="positions">
                    <i class="fas fa-briefcase mr-1.5"></i>求职进度
                </button>
                <button onclick="app.switchView('resumes')" class="nav-btn px-3 py-1.5 rounded-md text-sm font-medium transition-all text-slate-600 hover:text-slate-900" data-view="resumes">
                    <i class="fas fa-file-alt mr-1.5"></i>资料库
                </button>
                <button onclick="app.switchView('analytics')" class="nav-btn px-3 py-1.5 rounded-md text-sm font-medium transition-all text-slate-600 hover:text-slate-900" data-view="analytics">
                    <i class="fas fa-lightbulb mr-1.5"></i>洞察
                </button>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="app.exportData()" class="px-3 py-1.5 text-sm text-slate-600 hover:text-slate-900 transition-colors" title="导出数据">
                    <i class="fas fa-download"></i>
                </button>
                <label class="px-3 py-1.5 text-sm text-slate-600 hover:text-slate-900 transition-colors cursor-pointer" title="导入数据">
                    <i class="fas fa-upload"></i>
                    <input type="file" class="hidden" accept=".json" onchange="app.importData(this)">
                </label>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-20 pb-12 px-4 max-w-7xl mx-auto">
        
        <!-- DASHBOARD VIEW -->
        <section id="view-dashboard" class="view-section fade-in">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white rounded-xl p-6 border border-slate-200 hover-card">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-slate-500 text-sm font-medium">总投递</span>
                        <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600"><i class="fas fa-paper-plane"></i></div>
                    </div>
                    <div class="text-3xl font-bold text-slate-900" id="stat-total">0</div>
                    <div class="text-xs text-slate-500 mt-1">本周新增 <span class="text-blue-600 font-semibold" id="stat-new-week">0</span></div>
                </div>
                <div class="bg-white rounded-xl p-6 border border-slate-200 hover-card">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-slate-500 text-sm font-medium">面试中</span>
                        <div class="w-8 h-8 rounded-lg bg-purple-50 flex items-center justify-center text-purple-600"><i class="fas fa-comments"></i></div>
                    </div>
                    <div class="text-3xl font-bold text-slate-900" id="stat-interviewing">0</div>
                    <div class="text-xs text-slate-500 mt-1">待面试 <span class="text-purple-600 font-semibold" id="stat-upcoming">0</span></div>
                </div>
                <div class="bg-white rounded-xl p-6 border border-slate-200 hover-card">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-slate-500 text-sm font-medium">Offer</span>
                        <div class="w-8 h-8 rounded-lg bg-emerald-50 flex items-center justify-center text-emerald-600"><i class="fas fa-trophy"></i></div>
                    </div>
                    <div class="text-3xl font-bold text-emerald-600" id="stat-offers">0</div>
                    <div class="text-xs text-slate-500 mt-1">通过率 <span class="emerald-600 font-semibold" id="stat-rate">0%</span></div>
                </div>
                <div class="bg-white rounded-xl p-6 border border-slate-200 hover-card">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-slate-500 text-sm font-medium">待跟进</span>
                        <div class="w-8 h-8 rounded-lg bg-amber-50 flex items-center justify-center text-amber-600"><i class="fas fa-clock"></i></div>
                    </div>
                    <div class="text-3xl font-bold text-amber-600" id="stat-followup">0</div>
                    <div class="text-xs text-slate-500 mt-1">超7天无反馈</div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 转化漏斗 -->
                <div class="bg-white rounded-xl p-6 border border-slate-200 lg:col-span-2">
                    <h3 class="font-semibold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fas fa-filter text-blue-500"></i> 转化漏斗
                    </h3>
                    <div class="space-y-3" id="funnel-container">
                        <!-- Dynamic -->
                    </div>
                </div>

                <!-- 近期动态 -->
                <div class="bg-white rounded-xl p-6 border border-slate-200">
                    <h3 class="font-semibold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fas fa-bell text-amber-500"></i> 待办提醒
                    </h3>
                    <div class="space-y-3 max-h-80 overflow-y-auto" id="reminder-list">
                        <!-- Dynamic -->
                    </div>
                </div>
            </div>

            <!-- 近期活动 -->
            <div class="mt-6 bg-white rounded-xl p-6 border border-slate-200">
                <h3 class="font-semibold text-slate-900 mb-4 flex items-center gap-2">
                    <i class="fas fa-history text-slate-500"></i> 近期活动
                </h3>
                <div class="space-y-4" id="recent-activities">
                    <!-- Dynamic -->
                </div>
            </div>
        </section>

        <!-- POSITIONS VIEW -->
        <section id="view-positions" class="view-section hidden fade-in">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">求职进度</h2>
                    <p class="text-slate-500 text-sm mt-1">管理公司、岗位与面试进度</p>
                </div>
                <button onclick="app.openCompanyModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                    <i class="fas fa-plus"></i> 添加公司
                </button>
            </div>

            <!-- Filter Bar -->
            <div class="flex items-center gap-3 mb-6 bg-white p-3 rounded-lg border border-slate-200">
                <input type="text" id="position-search" placeholder="搜索公司或岗位..." class="flex-1 px-3 py-2 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="app.renderPositions()">
                <select id="status-filter" class="px-3 py-2 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="app.renderPositions()">
                    <option value="">全部状态</option>
                    <option value="投递">投递</option>
                    <option value="笔试">笔试</option>
                    <option value="一面">一面</option>
                    <option value="二面">二面</option>
                    <option value="三面">三面</option>
                    <option value="HR面">HR面</option>
                    <option value="Offer">Offer</option>
                    <option value="拒绝">拒绝</option>
                    <option value="接受">接受</option>
                </select>
                <select id="priority-filter" class="px-3 py-2 text-sm border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="app.renderPositions()">
                    <option value="">全部优先级</option>
                    <option value="5">⭐⭐⭐⭐⭐</option>
                    <option value="4">⭐⭐⭐⭐</option>
                    <option value="3">⭐⭐⭐</option>
                    <option value="2">⭐⭐</option>
                    <option value="1">⭐</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="positions-grid">
                <!-- Dynamic -->
            </div>
        </section>

        <!-- RESUMES VIEW -->
        <section id="view-resumes" class="view-section hidden fade-in">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">资料库</h2>
                    <p class="text-slate-500 text-sm mt-1">管理简历版本、自我介绍与求职资料</p>
                </div>
                <button onclick="app.openResumeModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                    <i class="fas fa-plus"></i> 添加资料
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <!-- Sidebar Categories -->
                <div class="lg:col-span-1 space-y-2">
                    <button onclick="app.setResumeFilter('all')" class="resume-cat-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium bg-blue-50 text-blue-700 border border-blue-200" data-cat="all">
                        <i class="fas fa-th-large mr-2"></i> 全部资料
                    </button>
                    <button onclick="app.setResumeFilter('resume')" class="resume-cat-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 border border-transparent" data-cat="resume">
                        <i class="fas fa-file-pdf mr-2"></i> 简历
                    </button>
                    <button onclick="app.setResumeFilter('intro')" class="resume-cat-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 border border-transparent" data-cat="intro">
                        <i class="fas fa-microphone mr-2"></i> 自我介绍
                    </button>
                    <button onclick="app.setResumeFilter('cover')" class="resume-cat-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 border border-transparent" data-cat="cover">
                        <i class="fas fa-envelope mr-2"></i> 求职信
                    </button>
                    <button onclick="app.setResumeFilter('other')" class="resume-cat-btn w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 border border-transparent" data-cat="other">
                        <i class="fas fa-folder mr-2"></i> 其他
                    </button>
                </div>

                <!-- Resume Grid -->
                <div class="lg:col-span-3">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="resumes-grid">
                        <!-- Dynamic -->
                    </div>
                </div>
            </div>
        </section>

        <!-- ANALYTICS VIEW -->
        <section id="view-analytics" class="view-section hidden fade-in">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-900">数据洞察</h2>
                <p class="text-slate-500 text-sm mt-1">用数据优化求职策略</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- 岗位类型通过率 -->
                <div class="bg-white rounded-xl p-6 border border-slate-200">
                    <h3 class="font-semibold text-slate-900 mb-4">岗位类型表现</h3>
                    <div id="position-type-stats" class="space-y-3">
                        <!-- Dynamic -->
                    </div>
                </div>

                <!-- 简历版本效果 -->
                <div class="bg-white rounded-xl p-6 border border-slate-200">
                    <h3 class="font-semibold text-slate-900 mb-4">简历版本效果</h3>
                    <div id="resume-effect-stats" class="space-y-3">
                        <!-- Dynamic -->
                    </div>
                </div>

                <!-- 知识盲区 -->
                <div class="bg-white rounded-xl p-6 border border-slate-200 lg:col-span-2">
                    <h3 class="font-semibold text-slate-900 mb-4">面试知识盲区</h3>
                    <div id="knowledge-gaps" class="flex flex-wrap">
                        <!-- Dynamic -->
                    </div>
                </div>

                <!-- 面试情绪分布 -->
                <div class="bg-white rounded-xl p-6 border border-slate-200">
                    <h3 class="font-semibold text-slate-900 mb-4">面试情绪分布</h3>
                    <div id="mood-stats" class="space-y-2">
                        <!-- Dynamic -->
                    </div>
                </div>

                <!-- 时间分布 -->
                <div class="bg-white rounded-xl p-6 border border-slate-200">
                    <h3 class="font-semibold text-slate-900 mb-4">投递时间分布</h3>
                    <div id="time-distribution" class="space-y-2">
                        <!-- Dynamic -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- MODALS -->

    <!-- Company Modal -->
    <div id="company-modal" class="fixed inset-0 modal-backdrop z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto slide-in">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white rounded-t-2xl">
                <h3 class="text-lg font-bold text-slate-900" id="company-modal-title">添加公司</h3>
                <button onclick="app.closeModal('company-modal')" class="text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="company-id">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">公司名称 <span class="text-red-500">*</span></label>
                    <input type="text" id="company-name" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="如：字节跳动">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">行业</label>
                        <input type="text" id="company-industry" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="如：互联网">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">公司规模</label>
                        <select id="company-scale" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            <option value="">未知</option>
                            <option value="初创">初创</option>
                            <option value="成长型">成长型</option>
                            <option value="大厂">大厂</option>
                            <option value="外企">外企</option>
                            <option value="国企">国企</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">公司官网/链接</label>
                    <input type="text" id="company-website" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">公司背景/备注</label>
                    <textarea id="company-notes" rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none" placeholder="融资阶段、产品矩阵、竞品分析..."></textarea>
                </div>
            </div>
            <div class="p-6 border-t border-slate-100 bg-slate-50 rounded-b-2xl flex justify-end gap-3">
                <button onclick="app.closeModal('company-modal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">取消</button>
                <button onclick="app.saveCompany()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">保存</button>
            </div>
        </div>
    </div>

    <!-- Position Modal -->
    <div id="position-modal" class="fixed inset-0 modal-backdrop z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto slide-in">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white rounded-t-2xl">
                <h3 class="text-lg font-bold text-slate-900" id="position-modal-title">添加岗位</h3>
                <button onclick="app.closeModal('position-modal')" class="text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="position-id">
                <input type="hidden" id="position-company-id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">岗位名称 <span class="text-red-500">*</span></label>
                        <input type="text" id="position-title" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="如：后端开发工程师">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">所属公司</label>
                        <select id="position-company-select" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            <!-- Dynamic -->
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">当前状态</label>

                const defaultData = {
                    companies: [],
                    positions: [],
                    resumes: [],
                    interviews: [],
                    activities: [],
                    settings: { theme: 'light' }
                };
                try {
                    const saved = localStorage.getItem('jobTrackerData');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        // Merge with defaults for backward compatibility
                        return { ...defaultData, ...parsed };
                    }
                } catch (e) {
                    console.error('Failed to load data', e);
                }
                return defaultData;
            }

                localStorage.setItem('jobTrackerData', JSON.stringify(this.data));
                this.render();

                    { id: 'i2', positionId: 'p1', round: '二面', date: '2026-04-05', interviewer: '李四（技术负责人）', questions: '系统设计：设计一个秒杀系统\n分布式事务方案\nKafka消息丢失处理', selfRating: 3, notes: '系统设计题思路有点乱，需要多练。分布式事务只知道2PC/3PC，对TCC和Saga不够熟悉。', mood: '紧张', result: '待反馈', createdAt: new Date().toISOString() },
                    { id: 'i3', positionId: 'p2', round: '一面', date: '2026-04-02', interviewer: '王五', questions: '算法题：LRU缓存实现\nTCP三次握手细节\n线程池参数设计', selfRating: 4, notes: '算法题一次AC，网络部分回答完整。', mood: '超水平发挥', result: '通过', createdAt: new Date().toISOString() }
                ];

                const demoActivities = [
                    { id: 'a1', positionId: 'p1', type: '投递', date: '2026-03-15', notes: '通过官网投递', createdAt: new Date(Date.now() - 20*86400000).toISOString() },
                    { id: 'a2', positionId: 'p1', type: '笔试', date: '2026-03-20', notes: '3道算法+2道SQL', createdAt: new Date(Date.now() - 15*86400000).toISOString() },
                    { id: 'a3', positionId: 'p1', type: '一面', date: '2026-03-28', notes: '通过', createdAt: new Date(Date.now() - 7*86400000).toISOString() },
                    { id: 'a4', positionId: 'p1', type: '二面', date: '2026-04-05', notes: '待反馈', createdAt: new Date().toISOString() },
                    { id: 'a5', positionId: 'p2', type: '投递', date: '2026-03-25', notes: '内推', createdAt: new Date(Date.now() - 10*86400000).toISOString() },
                    { id: 'a6', positionId: 'p2', type: '一面', date: '2026-04-02', notes: '通过', createdAt: new Date(Date.now() - 3*86400000).toISOString() },
                    { id: 'a7', positionId: 'p3', type: '投递', date: '2026-04-10', notes: '', createdAt: new Date(Date.now() - 1*86400000).toISOString() }

                this.data.companies = demoCompanies;
                this.data.resumes = demoResumes;
                this.data.positions = demoPositions;
                this.data.interviews = demoInterviews;
                this.data.activities = demoActivities;
                this.save();
            }

            // Navigation
            switchView(view) {
                this.currentView = view;
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                document.getElementById(`view-${view}`).classList.remove('hidden');
                
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.dataset.view === view) {
                        btn.classList.add('bg-white', 'shadow-sm', 'text-slate-900');
                        btn.classList.remove('text-slate-600');
                    } else {
                        btn.classList.remove('bg-white', 'shadow-sm', 'text-slate-900');
                        btn.classList.add('text-slate-600');
                    }
                });
                
                this.render();
            }

            // Rendering
            render() {
                if (this.currentView === 'dashboard') this.renderDashboard();
                else if (this.currentView === 'positions') this.renderPositions();
                else if (this.currentView === 'resumes') this.renderResumes();
                else if (this.currentView === 'analytics') this.renderAnalytics();
            }

            renderDashboard() {
                const now = new Date();
                const weekAgo = new Date(now - 7 * 86400000);
                
                // Stats
                const total = this.data.positions.length;
                const newWeek = this.data.positions.filter(p => new Date(p.createdAt) > weekAgo).length;
                const interviewing = this.data.positions.filter(p => ['一面','二面','三面','HR面'].includes(p.status)).length;
                const upcoming = this.data.interviews.filter(i => !i.result || i.result === '待反馈').length;
                const offers = this.data.positions.filter(p => p.status === 'Offer' || p.status === '接受').length;
                const rejected = this.data.positions.filter(p => p.status === '拒绝').length;
                const completed = offers + rejected;
                const rate = completed > 0 ? Math.round((offers / completed) * 100) : 0;
                
                // Follow up: no update > 7 days and status is 投递/笔试/一面 etc
                const followUp = this.data.positions.filter(p => {
                    if (['Offer','接受','拒绝'].includes(p.status)) return false;
                    const lastUpdate = new Date(p.updatedAt);
                    return (now - lastUpdate) > 7 * 86400000;
                }).length;

                document.getElementById('stat-total').textContent = total;
                document.getElementById('stat-new-week').textContent = newWeek;
                document.getElementById('stat-interviewing').textContent = interviewing;
                document.getElementById('stat-upcoming').textContent = upcoming;
                document.getElementById('stat-offers').textContent = offers;
                document.getElementById('stat-rate').textContent = rate + '%';
                document.getElementById('stat-followup').textContent = followUp;

                // Funnel
                const stages = ['投递', '笔试', '一面', '二面', '三面', 'HR面', 'Offer'];
                const stageCounts = stages.map(s => this.data.positions.filter(p => {
                    const idx = stages.indexOf(p.status);
                    return idx >= stages.indexOf(s) && p.status !== '拒绝';
                }).length);
                const maxCount = Math.max(...stageCounts, 1);
                
                const funnelHtml = stages.map((stage, i) => {
                    const count = stageCounts[i];
                    const width = (count / maxCount) * 100;
                    const prevCount = i > 0 ? stageCounts[i-1] : count;
                    const conversion = i > 0 && prevCount > 0 ? Math.round((count / prevCount) * 100) : 100;
                    const colors = ['bg-slate-400', 'bg-amber-400', 'bg-blue-400', 'bg-purple-400', 'bg-pink-400', 'bg-emerald-400', 'bg-emerald-500'];
                    return `
                        <div class="flex items-center gap-3">
                            <div class="w-16 text-sm font-medium text-slate-600 text-right">${stage}</div>
                            <div class="flex-1 h-8 bg-slate-100 rounded-lg overflow-hidden relative">
                                <div class="h-full ${colors[i]} rounded-lg funnel-bar flex items-center justify-end pr-2" style="width: ${width}%">
                                    <span class="text-white text-xs font-bold">${count}</span>
                                </div>
                            </div>
                            <div class="w-12 text-xs text-slate-500">${i > 0 ? conversion + '%' : '-'}</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('funnel-container').innerHTML = funnelHtml;

                // Reminders
                const reminders = [];
                this.data.positions.forEach(p => {
                    if (p.deadline) {
                        const deadline = new Date(p.deadline);
                        const daysLeft = Math.ceil((deadline - now) / 86400000);
                        if (daysLeft >= -1 && daysLeft <= 3 && !['Offer','接受','拒绝'].includes(p.status)) {
                            const company = this.data.companies.find(c => c.id === p.companyId);
                            reminders.push({ type: 'deadline', text: `${company?.name || ''} ${p.title} ${daysLeft < 0 ? '已逾期' : daysLeft + '天后截止'}`, date: p.deadline, priority: daysLeft < 0 ? 'high' : 'medium' });
                        }
                    }
                });
                
                this.data.interviews.forEach(i => {
                    if (i.result === '待反馈') {
                        const interviewDate = new Date(i.date);
                        const daysSince = Math.floor((now - interviewDate) / 86400000);
                        if (daysSince >= 3) {
                            const position = this.data.positions.find(p => p.id === i.positionId);
                            const company = position ? this.data.companies.find(c => c.id === position.companyId) : null;
                            reminders.push({ type: 'followup', text: `${company?.name || ''} ${i.round} 已${daysSince}天未反馈`, date: i.date, priority: daysSince > 7 ? 'high' : 'medium' });
                        }
                    }
                });

                const reminderHtml = reminders.length === 0 
                    ? '<div class="text-sm text-slate-400 text-center py-8">暂无待办事项 🎉</div>'
                    : reminders.sort((a,b) => new Date(a.date) - new Date(b.date)).map(r => `
                        <div class="flex items-start gap-3 p-3 rounded-lg ${r.priority === 'high' ? 'bg-red-50 border border-red-100' : 'bg-amber-50 border border-amber-100'}">
                            <div class="w-2 h-2 rounded-full ${r.priority === 'high' ? 'bg-red-500' : 'bg-amber-500'} mt-1.5 flex-shrink-0"></div>
                            <div class="flex-1">
                                <div class="text-sm font-medium ${r.priority === 'high' ? 'text-red-800' : 'text-amber-800'}">${r.text}</div>
                                <div class="text-xs ${r.priority === 'high' ? 'text-red-600' : 'text-amber-600'} mt-0.5">${r.date}</div>
                            </div>
                        </div>
                    `).join('');
                document.getElementById('reminder-list').innerHTML = reminderHtml;

                // Recent activities
                const recentActivities = [...this.data.activities]
                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                    .slice(0, 10);
                
                const activityHtml = recentActivities.map(a => {
                    const position = this.data.positions.find(p => p.id === a.positionId);
                    const company = position ? this.data.companies.find(c => c.id === position.companyId) : null;
                    const statusColors = {
                        '投递': 'text-slate-500 bg-slate-100',
                        '笔试': 'text-amber-600 bg-amber-100',
                        '一面': 'text-blue-600 bg-blue-100',
                        '二面': 'text-purple-600 bg-purple-100',
                        '三面': 'text-pink-600 bg-pink-100',
                        'HR面': 'text-emerald-600 bg-emerald-100',
                        'Offer': 'text-emerald-700 bg-emerald-100 font-bold',
                        '拒绝': 'text-red-600 bg-red-100'
                    };
                    return `
                        <div class="flex items-center gap-4 p-3 hover:bg-slate-50 rounded-lg transition-colors">
                            <div class="w-16 text-xs text-slate-500 font-medium">${a.date}</div>
                            <div class="px-2 py-1 rounded text-xs font-medium ${statusColors[a.type] || 'text-slate-600 bg-slate-100'}">${a.type}</div>
                            <div class="flex-1 text-sm text-slate-700">
                                <span class="font-medium">${company?.name || '未知公司'}</span>
                                <span class="text-slate-400 mx-1">·</span>
                                <span>${position?.title || ''}</span>
                            </div>
                            ${a.notes ? `<div class="text-xs text-slate-500 max-w-xs truncate">${a.notes}</div>` : ''}
                        </div>
                    `;
                }).join('');
                document.getElementById('recent-activities').innerHTML = activityHtml || '<div class="text-sm text-slate-400 text-center py-8">暂无活动记录</div>';
            }

            renderPositions() {
                const search = document.getElementById('position-search').value.toLowerCase();
                const statusFilter = document.getElementById('status-filter').value;
                const priorityFilter = document.getElementById('priority-filter').value;

                let filtered = this.data.positions.filter(p => {
                    const company = this.data.companies.find(c => c.id === p.companyId);
                    const matchSearch = !search || 
                        (company?.name || '').toLowerCase().includes(search) || 
                        (p.title || '').toLowerCase().includes(search) ||
                        (p.location || '').toLowerCase().includes(search);
                    const matchStatus = !statusFilter || p.status === statusFilter;
                    const matchPriority = !priorityFilter || p.priority === parseInt(priorityFilter);
                    return matchSearch && matchStatus && matchPriority;
                });

                // Sort by priority desc, then updatedAt desc
                filtered.sort((a, b) => {
                    if (b.priority !== a.priority) return b.priority - a.priority;
                    return new Date(b.updatedAt) - new Date(a.updatedAt);
                });

                const grid = document.getElementById('positions-grid');
                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">
                        <i class="fas fa-inbox text-4xl mb-3"></i>
                        <p>暂无符合条件的岗位</p>
                    </div>`;
                    return;
                }

                grid.innerHTML = filtered.map(p => {
                    const company = this.data.companies.find(c => c.id === p.companyId);
                    const resume = this.data.resumes.find(r => r.id === p.resumeId);
                    const interviews = this.data.interviews.filter(i => i.positionId === p.id);
                    const lastInterview = interviews.sort((a,b) => new Date(b.date) - new Date(a.date))[0];
                    
                    const stars = Array(5).fill(0).map((_, i) => 
                        `<i class="fas fa-star text-xs ${i < p.priority ? 'text-amber-400' : 'text-slate-200'}"></i>`
                    ).join('');

                    const statusLabels = {
                        '投递': '投递', '笔试': '笔试', '一面': '一面', '二面': '二面',
                        '三面': '三面', 'HR面': 'HR面', 'Offer': 'Offer', '拒绝': '拒绝', '接受': '接受'
                    };

                    return `
                        <div class="bg-white rounded-xl p-5 border border-slate-200 hover-card cursor-pointer" onclick="app.openPositionDetail('${p.id}')">
                            <div class="flex items-start justify-between mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600 font-bold text-sm">
                                        ${(company?.name || '公').substring(0, 1)}
                                    </div>
                                    <div>
                                        <h3 class="font-semibold text-slate-900 text-sm">${company?.name || '未知公司'}</h3>
                                        <p class="text-xs text-slate-500">${p.title}</p>
                                    </div>
                                </div>
                                <span class="px-2 py-1 rounded-md text-xs font-medium status-${p.status}">${statusLabels[p.status]}</span>
                            </div>
                            
                            <div class="flex items-center gap-1 mb-3">${stars}</div>
                            
                            <div class="flex items-center gap-4 text-xs text-slate-500 mb-3">
                                <span><i class="fas fa-map-marker-alt mr-1"></i>${p.location || '未知'}</span>
                                <span><i class="fas fa-yen-sign mr-1"></i>${p.salary || '面议'}</span>
                            </div>

                            ${resume ? `
                                <div class="flex items-center gap-2 p-2 bg-slate-50 rounded-lg mb-3">
                                    <i class="fas fa-file-alt text-slate-400 text-xs"></i>
                                    <span class="text-xs text-slate-600 truncate">${resume.name}</span>
                                </div>
                            ` : ''}

                            <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                                <div class="text-xs text-slate-400">
                                    ${lastInterview ? `最近: ${lastInterview.round} ${lastInterview.date}` : '暂无面试'}
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="event.stopPropagation(); app.advanceStatus('${p.id}')" class="text-xs px-2 py-1 bg-blue-50 text-blue-600 rounded hover:bg-blue-100 transition-colors" title="推进状态">
                                        <i class="fas fa-arrow-right"></i>
                                    </button>
                                    <button onclick="event.stopPropagation(); app.openInterviewModal('${p.id}')" class="text-xs px-2 py-1 bg-slate-50 text-slate-600 rounded hover:bg-slate-100 transition-colors" title="记录面试">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderResumes() {
                let filtered = this.data.resumes;
                if (this.resumeFilter !== 'all') {
                    filtered = filtered.filter(r => r.type === this.resumeFilter);
                }

                const grid = document.getElementById('resumes-grid');
                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">
                        <i class="fas fa-folder-open text-4xl mb-3"></i>
                        <p>暂无资料</p>
                    </div>`;
                    return;
                }

                const typeLabels = { resume: '简历', intro: '自我介绍', cover: '求职信', other: '其他' };
                const typeIcons = { resume: 'fa-file-pdf', intro: 'fa-microphone', cover: 'fa-envelope', other: 'fa-file' };
                const typeColors = { resume: 'text-red-500 bg-red-50', intro: 'text-blue-500 bg-blue-50', cover: 'text-purple-500 bg-purple-50', other: 'text-slate-500 bg-slate-50' };

                grid.innerHTML = filtered.map(r => {
                    const linkedPositions = this.data.positions.filter(p => p.resumeId === r.id);
                    return `
                        <div class="bg-white rounded-xl p-5 border border-slate-200 hover-card">
                            <div class="flex items-start justify-between mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-lg ${typeColors[r.type]} flex items-center justify-center">
                                        <i class="fas ${typeIcons[r.type]}"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-semibold text-slate-900 text-sm">${r.name}</h3>
                                        <p class="text-xs text-slate-500">${typeLabels[r.type]} · ${r.target || '通用'}</p>
                                    </div>
                                </div>
                                <div class="flex gap-1">
                                    <button onclick="app.editResume('${r.id}')" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors">
                                        <i class="fas fa-edit text-xs"></i>
                                    </button>
                                </div>
                            </div>
                            
                            ${r.version ? `<div class="text-xs font-medium text-blue-600 bg-blue-50 inline-block px-2 py-1 rounded mb-3">${r.version}</div>` : ''}
                            
                            <div class="bg-slate-50 rounded-lg p-3 mb-3 max-h-32 overflow-y-auto">
                                <p class="text-xs text-slate-600 whitespace-pre-wrap leading-relaxed">${r.content || '无内容'}</p>
                            </div>

                            <div class="flex items-center justify-between text-xs text-slate-500">
                                <span>${linkedPositions.length} 个岗位关联</span>
                                ${r.fileName ? `<span class="truncate max-w-[150px]" title="${r.fileName}"><i class="fas fa-paperclip mr-1"></i>${r.fileName}</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                // Update sidebar active state
                document.querySelectorAll('.resume-cat-btn').forEach(btn => {
                    if (btn.dataset.cat === this.resumeFilter) {
                        btn.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');
                        btn.classList.remove('text-slate-600', 'hover:bg-slate-50', 'border-transparent');
                    } else {
                        btn.classList.remove('bg-blue-50', 'text-blue-700', 'border-blue-200');
                        btn.classList.add('text-slate-600', 'hover:bg-slate-50', 'border-transparent');
                    }
                });
            }

            renderAnalytics() {
                // Position type stats
                const typeMap = {};
                this.data.positions.forEach(p => {
                    const type = p.title.includes('后端') || p.title.includes('后台') ? '后端开发' :
                                 p.title.includes('前端') ? '前端开发' :
                                 p.title.includes('产品') ? '产品经理' :
                                 p.title.includes('算法') ? '算法工程师' : '其他';
                    if (!typeMap[type]) typeMap[type] = { total: 0, interview: 0, offer: 0 };
                    typeMap[type].total++;
                    if (['一面','二面','三面','HR面','Offer','接受'].includes(p.status)) typeMap[type].interview++;
                    if (['Offer','接受'].includes(p.status)) typeMap[type].offer++;
                });

                const typeHtml = Object.entries(typeMap).map(([type, stats]) => {
                    const interviewRate = stats.total > 0 ? Math.round((stats.interview / stats.total) * 100) : 0;
                    const offerRate = stats.interview > 0 ? Math.round((stats.offer / stats.interview) * 100) : 0;
                    return `
                        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                            <div>
                                <div class="font-medium text-sm text-slate-900">${type}</div>
                                <div class="text-xs text-slate-500">${stats.total} 投递 · ${stats.interview} 面试 · ${stats.offer} Offer</div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-bold text-blue-600">${interviewRate}%</div>
                                <div class="text-xs text-slate-500">面试率</div>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('position-type-stats').innerHTML = typeHtml || '<div class="text-sm text-slate-400 text-center py-8">数据不足</div>';

                // Resume effect stats
                const resumeMap = {};
                this.data.resumes.forEach(r => {
                    const positions = this.data.positions.filter(p => p.resumeId === r.id);
                    const interviews = this.data.interviews.filter(i => {
                        const pos = this.data.positions.find(p => p.id === i.positionId);
                        return pos && pos.resumeId === r.id;
                    });
                    const passCount = interviews.filter(i => i.result === '通过').length;
                    resumeMap[r.name] = {
                        total: positions.length,
                        interview: interviews.length,
                        pass: passCount,
                        rate: interviews.length > 0 ? Math.round((passCount / interviews.length) * 100) : 0
                    };
                });

                const resumeHtml = Object.entries(resumeMap).map(([name, stats]) => `
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                        <div>
                            <div class="font-medium text-sm text-slate-900">${name}</div>
                            <div class="text-xs text-slate-500">${stats.total} 关联 · ${stats.interview} 场面试</div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-bold ${stats.rate >= 60 ? 'text-emerald-600' : stats.rate >= 40 ? 'text-blue-600' : 'text-amber-600'}">${stats.rate}%</div>
                            <div class="text-xs text-slate-500">通过率</div>
                        </div>
                    </div>
                `).join('');
                document.getElementById('resume-effect-stats').innerHTML = resumeHtml || '<div class="text-sm text-slate-400 text-center py-8">数据不足</div>';

                // Knowledge gaps (from interview questions)
                const questionWords = {};
                this.data.interviews.forEach(i => {
                    if (i.questions) {
                        const lines = i.questions.split('\n').filter(q => q.trim());
                        lines.forEach(q => {
                            // Simple keyword extraction
                            const keywords = ['Redis', 'MySQL', 'Kafka', 'Docker', 'K8s', '算法', '网络', 'OS', 'Go', 'Java', '微服务', '分布式', '设计模式', '并发'];
                            keywords.forEach(k => {
                                if (q.includes(k)) {
                                    questionWords[k] = (questionWords[k] || 0) + 1;
                                }
                            });
                        });
                    }
                });

                const sortedWords = Object.entries(questionWords).sort((a,b) => b[1] - a[1]);
                const wordHtml = sortedWords.map(([word, count]) => {
                    const level = count >= 3 ? 'high' : count >= 2 ? 'medium' : '';
                    return `<span class="word-tag ${level}">${word} (${count})</span>`;
                }).join('');
                document.getElementById('knowledge-gaps').innerHTML = wordHtml || '<div class="text-sm text-slate-400">暂无数据，多记录面试问题即可生成</div>';

                // Mood stats
                const moodMap = {};
                this.data.interviews.forEach(i => {
                    const m = i.mood || '一般';
                    moodMap[m] = (moodMap[m] || 0) + 1;
                });
                const totalMoods = Object.values(moodMap).reduce((a,b) => a+b, 0);
                const moodHtml = Object.entries(moodMap).map(([mood, count]) => {
                    const pct = totalMoods > 0 ? Math.round((count / totalMoods) * 100) : 0;
                    const colors = {
                        '紧张': 'bg-amber-500',
                        '平稳': 'bg-blue-500',
                        '超水平发挥': 'bg-emerald-500',
                        '被问懵': 'bg-red-500',
                        '一般': 'bg-slate-400'
                    };
                    return `
                        <div class="flex items-center gap-3">
                            <div class="w-20 text-sm text-slate-600">${mood}</div>
                            <div class="flex-1 h-4 bg-slate-100 rounded-full overflow-hidden">
                                <div class="h-full ${colors[mood] || 'bg-slate-400'} rounded-full" style="width: ${pct}%"></div>
                            </div>
                            <div class="w-10 text-sm text-slate-500 text-right">${count}</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('mood-stats').innerHTML = moodHtml || '<div class="text-sm text-slate-400 text-center py-8">暂无数据</div>';

                // Time distribution
                const monthMap = {};
                this.data.positions.forEach(p => {
                    const d = new Date(p.createdAt);
                    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                    monthMap[key] = (monthMap[key] || 0) + 1;
                });
                const timeHtml = Object.entries(monthMap).sort().map(([month, count]) => `
                    <div class="flex items-center justify-between p-2">
                        <span class="text-sm text-slate-600">${month}</span>
                        <span class="text-sm font-medium text-slate-900">${count} 投递</span>
                    </div>
                `).join('');
                document.getElementById('time-distribution').innerHTML = timeHtml || '<div class="text-sm text-slate-400 text-center py-8">暂无数据</div>';
            }

            advanceStatus(positionId) {
                const p = this.data.positions.find(x => x.id === positionId);
                if (!p) return;
                
                const flow = ['投递', '笔试', '一面', '二面', '三面', 'HR面', 'Offer'];
                const idx = flow.indexOf(p.status);
                if (idx >= 0 && idx < flow.length - 1) {
                    const newStatus = flow[idx + 1];
                    p.status = newStatus;
                    p.updatedAt = new Date().toISOString();
                    
                    this.data.activities.push({
                        id: 'a' + Date.now(),
                        positionId: p.id,
                        type: newStatus,
                        date: new Date().toISOString().split('T')[0],
                        notes: '状态推进',
                        createdAt: new Date().toISOString()
                    });
                    
                    this.save();

                            <div class="bg-slate-50 rounded-lg p-4 text-sm space-y-2">
                                <div><span class="font-medium">行业：</span>${company?.industry || '-'}</div>
                                <div><span class="font-medium">规模：</span>${company?.scale || '-'}</div>
                                <div><span class="font-medium">地点：</span>${p.location || '-'}</div>
                                <div><span class="font-medium">薪资：</span>${p.salary || '-'}</div>
                                ${company?.notes ? `<div class="mt-2 pt-2 border-t border-slate-200 whitespace-pre-wrap">${company.notes}</div>` : ''}
                            </div>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2"><i class="fas fa-file-alt text-purple-500"></i> 岗位JD</h2>
                            <div class="bg-slate-50 rounded-lg p-4 text-sm whitespace-pre-wrap max-h-48 overflow-y-auto">
                                ${p.jd || '暂无JD'}
                            </div>
                        </div>
                    </div>

                    ${resume ? `
                        <div class="mb-6">
                            <h2 class="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2"><i class="fas fa-user text-emerald-500"></i> 关联资料</h2>
                            <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-4">
                                <div class="font-medium text-emerald-900 mb-1">${resume.name} ${resume.version ? '(' + resume.version + ')' : ''}</div>
                                <div class="text-sm text-emerald-700 whitespace-pre-wrap max-h-40 overflow-y-auto">${resume.content || ''}</div>
                            </div>
                        </div>
                    ` : ''}

                    ${prevQuestions.length > 0 ? `
                        <div class="mb-6">
                            <h2 class="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2"><i class="fas fa-history text-amber-500"></i> 历史问题（同岗位/同公司）</h2>
                            <div class="bg-amber-50 border border-amber-200 rounded-lg p-4">
                                <ul class="list-disc list-inside text-sm text-amber-800 space-y-1">
                                    ${prevQuestions.map(q => `<li>${q}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    ` : ''}

                    ${interviews.length > 0 ? `
                        <div class="mb-6">
                            <h2 class="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2"><i class="fas fa-lightbulb text-pink-500"></i> 往期复盘</h2>
                            <div class="space-y-3">
                                ${interviews.slice(0, 2).map(i => `
                                    <div class="bg-pink-50 border border-pink-200 rounded-lg p-4 text-sm">
                                        <div class="font-medium text-pink-900 mb-1">${i.round} · ${i.date} · ${i.mood} · ${i.selfRating}星</div>
                                        <div class="text-pink-700 whitespace-pre-wrap">${i.notes || '无笔记'}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="mt-8 pt-6 border-t border-slate-200">
                        <h2 class="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2"><i class="fas fa-pen text-slate-500"></i> 临时笔记区</h2>
                        <div class="border-2 border-dashed border-slate-300 rounded-lg p-4 min-h-[100px] text-slate-400 text-sm">
                            （此处可手写补充昨晚突击的知识点...）
                        </div>
                    </div>
                `;

                document.getElementById('prep-modal').classList.remove('hidden');
            }

            // Utilities
            closeModal(modalId) {
                document.getElementById(modalId).classList.add('hidden');
            }

            exportData() {
                const dataStr = JSON.stringify(this.data, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `jobtracker_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            }

            importData(input) {
                const file = input.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (confirm('导入将覆盖现有数据，确定继续？')) {
                            this.data = { ...this.loadData(), ...data };
                            this.save();
                            alert('导入成功！');
                        }
                    } catch (err) {
                        alert('文件格式错误');
                    }
                };
                reader.readAsText(file);
                input.value = '';
            }
        }

        // Initialize
        const app = new JobTracker();

        // Close modals on backdrop click
        document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
            backdrop.addEventListener('click', (e) => {
                if (e.target === backdrop) {
                    backdrop.classList.add('hidden');
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.add('hidden'));
            }
        });
    </script>
</body>
</html>
