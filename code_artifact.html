<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面试追踪系统</title>
    <style>
        /* 所有的样式都合并在这里 */
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .card { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .status-tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8em; }
        .status-applied { background: #e0f7fa; color: #00796b; }
        /* 更多样式可以在这里添加 */
    </style>
</head>
<body>
    <div class="container">
        <h1>面试追踪系统</h1>
        <div id="app">
            <p>正在加载面试数据...</p>
        </div>
    </div>

    <script>
        // 核心逻辑合并在这里
        const appState = {
            jobs: JSON.parse(localStorage.getItem('jobTrackerData') || '[]')
        };

        function render() {
            const container = document.getElementById('app');
            if (appState.jobs.length === 0) {
                container.innerHTML = '<p>暂无记录，请点击添加。</p>';
                return;
            }
            container.innerHTML = appState.jobs.map(job => `
                <div class="card">
                    <h3>${job.company} - ${job.role}</h3>
                    <span class="status-tag status-applied">${job.status}</span>
                </div>
            `).join('');
        }

        // 初始化
        render();
        console.log("应用已启动，本地模式运行中。");
    </script>
</body>
</html>
